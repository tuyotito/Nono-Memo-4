name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Générer les images (icône + écran de démarrage)
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 1024 -h 1024 assets/icon.svg -o assets/icon-only.png
          rsvg-convert -w 2732 -h 2732 assets/splash.svg -o assets/splash.png
          cp assets/splash.png assets/splash-dark.png

      - name: Créer le projet Android
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#233152' --splashBackgroundColor '#233152'
          npx cap sync android

      - name: Compiler l'APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: nono-memo-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
